<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="color-scheme" content="light">
    <title>Share Your Feedback</title>

    <link class="favicon" rel="icon" type="image/jpeg" href="https://huggingface.co/NAwafo/SmolLM-Keyboard-GGUF/resolve/main/Vector%20(4).png?download=true">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', sans-serif;
            color: #1a1a1a;
            -webkit-font-smoothing: antialiased;
            /* Beautiful soft gradient background */
            background: linear-gradient(135deg, #f0f7ff 0%, #ffffff 50%, #e6f2ff 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
        }

        /* Subtle entrance animation */
        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .animate-fade-up {
            animation: fadeUp 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }
    </style>
</head>
<body>

    <!-- Main Standalone Form Card -->
    <div id="feedbackContainer" class="bg-white rounded-[32px] w-full max-w-lg p-8 sm:p-10 shadow-[0_20px_50px_rgba(0,102,204,0.08)] flex flex-col items-center animate-fade-up border border-blue-50/50">
        
        <!-- Document Illustration -->
        <div class="relative w-28 h-28 mb-4 flex items-center justify-center">
            <div class="absolute inset-0 bg-blue-50 rounded-full opacity-60 filter blur-md"></div>
            <svg class="w-20 h-20 relative z-10" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
                <rect x="25" y="15" width="50" height="65" rx="8" fill="white" stroke="#E2E8F0" stroke-width="2" />
                <line x1="35" y1="28" x2="55" y2="28" stroke="#111111" stroke-width="3" stroke-linecap="round" />
                <line x1="35" y1="38" x2="65" y2="38" stroke="#E2E8F0" stroke-width="2" stroke-linecap="round" />
                <line x1="35" y1="46" x2="65" y2="46" stroke="#E2E8F0" stroke-width="2" stroke-linecap="round" />
                <line x1="35" y1="54" x2="55" y2="54" stroke="#F43F5E" stroke-width="2.5" stroke-linecap="round" />
                <line x1="35" y1="62" x2="45" y2="62" stroke="#F43F5E" stroke-width="2.5" stroke-linecap="round" />
                <circle cx="65" cy="70" r="14" fill="#0066cc" />
                <path d="M65 64V74M65 74L61 70M65 74L69 70" stroke="white" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
            </svg>
        </div>

        <!-- Header Titles -->
        <h3 class="text-[26px] font-extrabold text-gray-900 tracking-tight text-center mb-2">Thank You For Consulting!</h3>
        <p class="text-sm text-gray-500 font-medium text-center max-w-[280px] mb-8 leading-relaxed">
            We value your experience. Please take a moment to share your feedback.
        </p>

        <!-- Hidden iframe to handle Google's strict CORS without redirecting the page -->
        <iframe name="hidden_iframe" id="hidden_iframe" style="display:none;"></iframe>

        <!-- Feedback Submission Form -->
        <form id="feedbackForm" action="https://script.google.com/macros/s/AKfycbzGM8-7ISd10bg5pZToBB_IeHt47zQTpBJsfezSQKCdBQpa5zGSnvU3pJFozmj_8-Rzkg/exec" method="POST" target="hidden_iframe" class="w-full">
            
            <!-- Underline Inputs (Name & Email) -->
            <div class="grid grid-cols-1 sm:grid-cols-2 gap-6 w-full mb-8">
                <div class="relative">
                    <input type="text" name="name" placeholder="Your Name" required class="w-full border-b-2 border-gray-100 focus:border-[#0066cc] outline-none py-2.5 text-[15px] text-gray-900 placeholder-gray-400 bg-transparent transition-colors" />
                </div>
                <div class="relative">
                    <input type="email" name="email" placeholder="Your Email" required class="w-full border-b-2 border-gray-100 focus:border-[#0066cc] outline-none py-2.5 text-[15px] text-gray-900 placeholder-gray-400 bg-transparent transition-colors" />
                </div>
            </div>

            <!-- Rating System -->
            <div class="w-full mb-8 flex flex-col items-center bg-gray-50/50 p-5 rounded-2xl border border-gray-50">
                <p class="text-sm font-semibold text-gray-800 text-center mb-4">How would you rate your experience?</p>
                
                <div class="flex flex-col items-center w-full max-w-[280px]">
                    <div class="flex justify-between w-full px-2" id="starsContainer">
                        <!-- Star Buttons -->
                        <button type="button" data-value="1" class="star-btn text-gray-300 hover:scale-110 transition duration-150" aria-label="Rate 1 Star">
                            <svg class="w-10 h-10 stroke-current fill-none" viewBox="0 0 24 24" stroke-width="1.5">
                                <path stroke-linecap="round" stroke-linejoin="round" d="M11.049 2.927c.3-.921 1.603-.921 1.902 0l1.519 4.674a1 1 0 00.95.69h4.907c.961 0 1.36 1.25.588 1.81l-3.97 2.883a1 1 0 00-.364 1.118l1.518 4.674c.3.921-.755 1.688-1.538 1.118l-3.971-2.883a1 1 0 00-1.18 0l-3.97 2.883c-.783.57-1.838-.197-1.538-1.118l1.518-4.674a1 1 0 00-.364-1.118L2.98 10.1c-.773-.56-.375-1.81.587-1.81h4.907a1 1 0 00.95-.69l1.519-4.674z"/>
                            </svg>
                        </button>
                        <button type="button" data-value="2" class="star-btn text-gray-300 hover:scale-110 transition duration-150" aria-label="Rate 2 Stars">
                            <svg class="w-10 h-10 stroke-current fill-none" viewBox="0 0 24 24" stroke-width="1.5">
                                <path stroke-linecap="round" stroke-linejoin="round" d="M11.049 2.927c.3-.921 1.603-.921 1.902 0l1.519 4.674a1 1 0 00.95.69h4.907c.961 0 1.36 1.25.588 1.81l-3.97 2.883a1 1 0 00-.364 1.118l1.518 4.674c.3.921-.755 1.688-1.538 1.118l-3.971-2.883a1 1 0 00-1.18 0l-3.97 2.883c-.783.57-1.838-.197-1.538-1.118l1.518-4.674a1 1 0 00-.364-1.118L2.98 10.1c-.773-.56-.375-1.81.587-1.81h4.907a1 1 0 00.95-.69l1.519-4.674z"/>
                            </svg>
                        </button>
                        <button type="button" data-value="3" class="star-btn text-gray-300 hover:scale-110 transition duration-150" aria-label="Rate 3 Stars">
                            <svg class="w-10 h-10 stroke-current fill-none" viewBox="0 0 24 24" stroke-width="1.5">
                                <path stroke-linecap="round" stroke-linejoin="round" d="M11.049 2.927c.3-.921 1.603-.921 1.902 0l1.519 4.674a1 1 0 00.95.69h4.907c.961 0 1.36 1.25.588 1.81l-3.97 2.883a1 1 0 00-.364 1.118l1.518 4.674c.3.921-.755 1.688-1.538 1.118l-3.971-2.883a1 1 0 00-1.18 0l-3.97 2.883c-.783.57-1.838-.197-1.538-1.118l1.518-4.674a1 1 0 00-.364-1.118L2.98 10.1c-.773-.56-.375-1.81.587-1.81h4.907a1 1 0 00.95-.69l1.519-4.674z"/>
                            </svg>
                        </button>
                        <button type="button" data-value="4" class="star-btn text-gray-300 hover:scale-110 transition duration-150" aria-label="Rate 4 Stars">
                            <svg class="w-10 h-10 stroke-current fill-none" viewBox="0 0 24 24" stroke-width="1.5">
                                <path stroke-linecap="round" stroke-linejoin="round" d="M11.049 2.927c.3-.921 1.603-.921 1.902 0l1.519 4.674a1 1 0 00.95.69h4.907c.961 0 1.36 1.25.588 1.81l-3.97 2.883a1 1 0 00-.364 1.118l1.518 4.674c.3.921-.755 1.688-1.538 1.118l-3.971-2.883a1 1 0 00-1.18 0l-3.97 2.883c-.783.57-1.838-.197-1.538-1.118l1.518-4.674a1 1 0 00-.364-1.118L2.98 10.1c-.773-.56-.375-1.81.587-1.81h4.907a1 1 0 00.95-.69l1.519-4.674z"/>
                            </svg>
                        </button>
                        <button type="button" data-value="5" class="star-btn text-gray-300 hover:scale-110 transition duration-150" aria-label="Rate 5 Stars">
                            <svg class="w-10 h-10 stroke-current fill-none" viewBox="0 0 24 24" stroke-width="1.5">
                                <path stroke-linecap="round" stroke-linejoin="round" d="M11.049 2.927c.3-.921 1.603-.921 1.902 0l1.519 4.674a1 1 0 00.95.69h4.907c.961 0 1.36 1.25.588 1.81l-3.97 2.883a1 1 0 00-.364 1.118l1.518 4.674c.3.921-.755 1.688-1.538 1.118l-3.971-2.883a1 1 0 00-1.18 0l-3.97 2.883c-.783.57-1.838-.197-1.538-1.118l1.518-4.674a1 1 0 00-.364-1.118L2.98 10.1c-.773-.56-.375-1.81.587-1.81h4.907a1 1 0 00.95-.69l1.519-4.674z"/>
                            </svg>
                        </button>
                    </div>
                    
                    <div class="flex justify-between w-full text-[12px] text-gray-400 mt-2 px-1 font-medium">
                        <span>Very Poor</span>
                        <span>Excellent</span>
                    </div>
                </div>
                <!-- Hidden rating storage -->
                <input type="hidden" id="ratingValue" name="rating" value="5" required />
            </div>

            <!-- Textarea -->
            <div class="w-full text-left mb-8">
                <textarea name="feedback" required placeholder="Any additional comments or suggestions?" class="w-full h-32 bg-[#F8F9FA] border border-gray-200 rounded-2xl p-5 text-[15px] outline-none focus:ring-4 focus:ring-blue-500/10 focus:border-[#0066cc] focus:bg-white transition-all resize-none placeholder-gray-400"></textarea>
            </div>

            <!-- Submit Button -->
            <div class="w-full mb-4">
                <button type="submit" class="w-full py-4 bg-[#0066cc] hover:bg-[#0052a3] text-white font-semibold rounded-2xl text-[16px] shadow-[0_8px_20px_rgba(0,102,204,0.2)] hover:shadow-[0_8px_25px_rgba(0,102,204,0.3)] transition-all transform hover:-translate-y-[1px]">Submit Feedback</button>
            </div>

            <p class="text-[12px] text-gray-400 text-center mt-6">
                Your feedback helps us improve and provide better care for you and others.
            </p>
        </form>
    </div>

    <!-- Scripts -->
    <script>
        // --- Star Rating Functionality ---
        const stars = document.querySelectorAll('.star-btn');
        const ratingValue = document.getElementById('ratingValue');
        let chosenRating = 5;

        updateStarIcons(chosenRating);

        stars.forEach(star => {
            const val = parseInt(star.getAttribute('data-value'));
            
            star.addEventListener('click', () => {
                chosenRating = val;
                ratingValue.value = val;
                updateStarIcons(val);
            });

            star.addEventListener('mouseenter', () => {
                updateStarIcons(val);
            });

            star.addEventListener('mouseleave', () => {
                updateStarIcons(chosenRating);
            });
        });

        function updateStarIcons(count) {
            stars.forEach(star => {
                const val = parseInt(star.getAttribute('data-value'));
                const svg = star.querySelector('svg');
                if (val <= count) {
                    svg.classList.remove('text-gray-300', 'fill-none');
                    svg.classList.add('text-yellow-400', 'fill-yellow-400');
                } else {
                    svg.classList.remove('text-yellow-400', 'fill-yellow-400');
                    svg.classList.add('text-gray-300', 'fill-none');
                }
            });
        }

        // --- Hidden Iframe Form Submission ---
        let submitted = false;
        const form = document.getElementById('feedbackForm');
        const hiddenIframe = document.getElementById('hidden_iframe');
        const container = document.getElementById('feedbackContainer');

        form.addEventListener('submit', function() {
            const submitBtn = form.querySelector('button[type="submit"]');
            submitBtn.innerHTML = `
                <svg class="animate-spin -ml-1 mr-2 h-5 w-5 text-white inline-block" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                    <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                    <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
                </svg>
                Sending...
            `;
            submitBtn.disabled = true;
            submitBtn.classList.add('opacity-80', 'cursor-not-allowed');
            submitted = true;
        });

        hiddenIframe.addEventListener('load', function() {
            if (submitted) {
                // Show the beautifully centered Thank You state
                container.innerHTML = `
                    <div class="flex flex-col items-center justify-center py-10 text-center w-full animate-fade-up">
                        <div class="w-24 h-24 bg-green-50 rounded-full flex items-center justify-center text-green-500 mb-8 border-[6px] border-white shadow-sm">
                            <svg class="w-12 h-12" fill="none" stroke="currentColor" stroke-width="3" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7"></path>
                            </svg>
                        </div>
                        <h3 class="text-3xl font-extrabold text-gray-900 mb-4 tracking-tight">Thank You!</h3>
                        <p class="text-gray-500 text-[16px] mb-10 max-w-[300px] mx-auto leading-relaxed">Your feedback was submitted successfully. We appreciate your valuable support.</p>
                        
                        <a href="https://doktura.ai" class="py-4 px-8 bg-[#0066cc] hover:bg-[#0052a3] text-white font-semibold rounded-2xl text-[16px] shadow-[0_8px_20px_rgba(0,102,204,0.2)] transition-all inline-block text-decoration-none">Return to Website</a>
                    </div>
                `;
                submitted = false; 
            }
        });
    </script>
</body>
</html>
